<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claude Compass</title><script src="popup.js"></script><link rel="stylesheet" href="popup.css"><script src="common.js" defer></script></head>
<body><header><div class="brand"><span aria-hidden="true">✳</span><div>compass<small>FOR CLAUDE</small></div></div><button id="pause" class="tracking" title="Pause tracking"><i></i><span id="tracking-label">Tracking</span></button></header><main><div class="eyebrow">TODAY</div><h1>Your activity.</h1><div class="metrics"><div><span>Active today</span><strong id="active">0m</strong></div><div><span>Idle today</span><strong id="idle">0m</strong></div></div><div class="list-heading"><h2>Recent conversations</h2><span id="count">0</span></div><div id="chats"></div><p id="empty" class="empty">Open a conversation on claude.ai to give it a color and start tracking your time.</p><p id="error" class="error" hidden></p><button id="mailbox" class="mailbox"><span>▤ &nbsp; Agent mailbox</span><span id="unread">0 unread</span></button><button id="dashboard" class="primary">Open workspace <span aria-hidden="true">↗</span></button><p class="privacy"><span></span> Your context stays on this device.</p></main></body>
</html>
